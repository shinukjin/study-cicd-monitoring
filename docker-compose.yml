services:
  app:
    image: ${APP_IMAGE:-ghcr.io/owner/study-cicd-monitoring:latest}
    build:
      context: .
    ports:
      - "${APP_PORT:-18080}:8080"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mariadb://host.docker.internal:3306/study}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-user1}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-1111}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - otel-collector
    networks:
      - monitor-net

  mariadb:
    profiles: ["local-db"]
    image: mariadb:11
    environment:
      MARIADB_DATABASE: study
      MARIADB_USER: user1
      MARIADB_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-1111}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-skic}
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - monitor-net

  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-19090}:9090"
    depends_on:
      - app
      - alertmanager
    networks:
      - monitor-net

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin1234}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-13000}:3000"
    depends_on:
      - prometheus
      - tempo
    networks:
      - monitor-net

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "${ALERTMANAGER_PORT:-19093}:9093"
    networks:
      - monitor-net

  node-exporter:
    profiles: ["linux-host-observe"]
    image: prom/node-exporter:v1.8.2
    command:
      - "--path.rootfs=/host"
    volumes:
      - /:/host:ro,rslave
    ports:
      - "${NODE_EXPORTER_PORT:-19100}:9100"
    networks:
      - monitor-net

  cadvisor:
    profiles: ["linux-host-observe"]
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    privileged: true
    ports:
      - "${CADVISOR_PORT:-18081}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitor-net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command:
      - "--config=/etc/otelcol-contrib/config.yaml"
    volumes:
      - ./monitoring/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${OTEL_GRPC_PORT:-14317}:4317"
      - "${OTEL_HTTP_PORT:-14318}:4318"
      - "${OTEL_METRICS_PORT:-18889}:8889"
    depends_on:
      - tempo
    networks:
      - monitor-net

  tempo:
    image: grafana/tempo:2.6.0
    user: "0:0"
    command:
      - "-config.file=/etc/tempo.yaml"
    volumes:
      - ./monitoring/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/tmp/tempo
    ports:
      - "${TEMPO_PORT:-13200}:3200"
    networks:
      - monitor-net

networks:
  monitor-net:
    driver: bridge

volumes:
  mariadb-data:
  tempo-data:

