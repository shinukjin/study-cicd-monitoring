name: study-cicd-monitoring

services:
  app:
    image: ${APP_IMAGE}
    build:
      context: .
    env_file:
      - .env
    ports:
      - "${APP_PORT}:${SERVER_PORT}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - otel-collector
    networks:
      - monitor-net

  mariadb:
    profiles: ["local-db"]
    image: mariadb:11
    env_file:
      - .env
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - monitor-net

  prometheus:
    image: prom/prometheus:v2.53.0
    env_file:
      - .env
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    ports:
      - "${PROMETHEUS_PORT}:9090"
    depends_on:
      - app
      - alertmanager
    networks:
      - monitor-net

  grafana:
    image: grafana/grafana:11.2.0
    env_file:
      - .env
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT}:3000"
    depends_on:
      - prometheus
      - tempo
    networks:
      - monitor-net

  alertmanager:
    image: prom/alertmanager:v0.27.0
    env_file:
      - .env
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "${ALERTMANAGER_PORT}:9093"
    networks:
      - monitor-net

  node-exporter:
    profiles: ["linux-host-observe"]
    image: prom/node-exporter:v1.8.2
    env_file:
      - .env
    command:
      - "--path.rootfs=/host"
    volumes:
      - /:/host:ro,rslave
    ports:
      - "${NODE_EXPORTER_PORT}:9100"
    networks:
      - monitor-net

  cadvisor:
    profiles: ["linux-host-observe"]
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    env_file:
      - .env
    privileged: true
    ports:
      - "${CADVISOR_PORT}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitor-net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    env_file:
      - .env
    command:
      - "--config=/etc/otelcol-contrib/config.yaml"
    volumes:
      - ./monitoring/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${OTEL_GRPC_PORT}:4317"
      - "${OTEL_HTTP_PORT}:4318"
      - "${OTEL_METRICS_PORT}:8889"
    depends_on:
      - tempo
    networks:
      - monitor-net

  tempo:
    image: grafana/tempo:2.6.0
    user: "0:0"
    env_file:
      - .env
    command:
      - "-config.file=/etc/tempo.yaml"
    volumes:
      - ./monitoring/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/tmp/tempo
    ports:
      - "${TEMPO_PORT}:3200"
    networks:
      - monitor-net

networks:
  monitor-net:
    driver: bridge

volumes:
  mariadb-data:
  tempo-data:
