name: Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (default: latest)"
        required: false
        default: "latest"
  workflow_run:
    workflows: ["Build and Push Image"]
    types:
      - completed

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/study-cicd-monitoring

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: self-hosted
    environment: production
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.image_tag }}" ]; then
            echo "tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "tag=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Deploy app container
        shell: bash
        run: |
          set -euo pipefail
          docker compose down --remove-orphans || true
          APP_IMAGE=${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }} docker compose pull app
          APP_IMAGE=${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }} docker compose up -d app
          docker image prune -f

      - name: Print deployed image
        run: echo "Deployed $IMAGE_NAME:${{ steps.vars.outputs.tag }}"
