<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CI/CD Control Center</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      --bg: #f3f6fb;
      --surface: #ffffff;
      --surface-alt: #f8fafc;
      --line: #d6dee8;
      --text: #0f172a;
      --muted: #5b6473;
      --accent: #0ea5e9;
      --good: #16a34a;
      --warn: #d97706;
      --bad: #dc2626;
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
    }
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      font-family: "Segoe UI", "Noto Sans KR", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 0%, #e0f2fe 0%, transparent 35%),
        radial-gradient(circle at 100% 0%, #dbeafe 0%, transparent 30%),
        var(--bg);
    }
    .shell {
      width: 100%;
      height: 100vh;
      padding: 12px;
      display: grid;
      grid-template-rows: auto auto auto auto minmax(0, 1fr);
      gap: 8px;
      min-width: 0;
    }
    .header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
    }
    .title { margin: 0; font-size: 20px; font-weight: 700; }
    .subtitle { margin-top: 4px; font-size: 12px; color: var(--muted); }
    .meta { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .chip {
      padding: 5px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: var(--surface-alt);
      white-space: nowrap;
    }
    .chip.ok { color: var(--good); border-color: #b9e7ca; background: #ecfdf3; }
    .chip.warn { color: var(--warn); border-color: #f8d9aa; background: #fff7ed; }
    .chip.bad { color: var(--bad); border-color: #f5b8b8; background: #fef2f2; }
    .chip.run { color: #0369a1; border-color: #bae6fd; background: #f0f9ff; }

    .card, .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px; min-width: 0; }
    .section-title { margin: 0; font-size: 14px; font-weight: 700; }
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }

    .kpi-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .kpi {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      min-height: 64px;
    }
    .kpi-label { font-size: 12px; color: var(--muted); font-weight: 600; }
    .kpi-value { margin-top: 5px; font-size: 20px; font-weight: 700; line-height: 1.1; word-break: break-word; }

    .ops-bar {
      display: grid;
      grid-template-columns: 1.1fr 1.2fr 1.2fr auto;
      gap: 8px;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px;
      min-width: 0;
    }
    .controls { display: grid; gap: 8px; min-width: 0; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    input, select, textarea, button {
      width: 100%; border: 1px solid var(--line); background: var(--surface);
      color: var(--text); border-radius: 8px; padding: 7px 8px; font-size: 12px;
      min-width: 0;
    }
    textarea { min-height: 54px; resize: vertical; }
    button { cursor: pointer; font-weight: 700; }
    .btn-primary { background: #0284c7; border-color: #0284c7; color: #fff; }
    .btn-warn { background: #d97706; border-color: #d97706; color: #fff; }
    .btn-bad { background: #dc2626; border-color: #dc2626; color: #fff; }

    .main-grid {
      display: grid;
      grid-template-columns: minmax(430px, 1.05fr) minmax(420px, 1fr) minmax(360px, .82fr);
      gap: 8px;
      align-items: stretch;
      min-height: 0;
      overflow: hidden;
    }
    .panel {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-height: 0;
      overflow: hidden;
    }
    .stack-panel {
      display: grid;
      grid-template-rows: auto minmax(80px, 1fr) auto;
      gap: 8px;
    }

    .view-tabs { display: flex; gap: 6px; }
    .view-btn { width: auto; padding: 6px 10px; }
    .view-btn.active { border-color: var(--accent); color: #075985; background: #ecfeff; }

    .scroll-area { min-height: 0; overflow: auto; padding-right: 2px; }
    .list { display: grid; gap: 6px; align-content: start; }
    .item { background: var(--surface-alt); border: 1px solid var(--line); border-radius: 8px; padding: 7px; font-size: 12px; }
    .item.active { border-color: #7dd3fc; background: #f0f9ff; }
    .grid4 { display: grid; grid-template-columns: minmax(120px, 1.2fr) minmax(82px, .8fr) auto minmax(120px, .9fr); gap: 6px; align-items: center; }
    .title-btn { border: none; background: transparent; color: #0369a1; padding: 0; text-align: left; cursor: pointer; font-weight: 700; }
    .mono { font-family: "Consolas", "Courier New", monospace; font-size: 12px; }

    .board { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 8px; min-height: 0; overflow: hidden; }
    .lane { border: 1px solid var(--line); border-radius: 8px; background: var(--surface-alt); padding: 8px; min-height: 0; overflow: auto; }
    .lane h4 { margin: 0 0 8px; font-size: 12px; color: var(--muted); }
    .lane .card-mini { border: 1px solid var(--line); border-radius: 6px; background: #fff; padding: 6px; margin-bottom: 6px; font-size: 11px; }

    .table-wrap { overflow: auto; border: 1px solid var(--line); border-radius: 8px; min-height: 0; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th,td { border-bottom: 1px solid var(--line); padding: 7px; text-align: left; }
    th { background: #f7fafc; color: #334155; position: sticky; top: 0; }

    .detail-grid { display: grid; grid-template-rows: auto minmax(0, .95fr) minmax(0, 1.15fr); gap: 8px; min-height: 0; }
    .detail-box { border: 1px solid var(--line); border-radius: 8px; background: #fff; padding: 8px; white-space: pre-wrap; font-size: 12px; min-height: 78px; max-height: 122px; overflow: auto; }
    .stages { display: grid; gap: 6px; min-height: 0; overflow: auto; align-content: start; }
    .stage { display: grid; grid-template-columns: 1fr auto; gap: 8px; border: 1px solid var(--line); background: var(--surface-alt); border-radius: 8px; padding: 7px; font-size: 12px; }
    .log { white-space: pre-wrap; background: #f8fafc; border: 1px solid var(--line); border-radius: 8px; padding: 8px; font-size: 11px; min-height: 0; overflow: auto; }
    .deploy-form { display: grid; gap: 6px; min-height: 0; }
    .deploy-actions { display: grid; gap: 6px; min-height: 0; }
    .compact-title { margin: 0 0 6px; font-size: 13px; font-weight: 700; }

    .alert { display: none; padding: 8px; border-radius: 8px; border: 1px solid var(--line); font-size: 12px; white-space: pre-wrap; }

    @media (max-width: 1180px) {
      body { height: auto; min-height: 100vh; overflow: auto; }
      .shell { height: auto; min-height: 100vh; grid-template-rows: auto; }
      .ops-bar, .main-grid { grid-template-columns: 1fr; overflow: visible; }
      .main-grid { align-items: start; }
      .panel, .stack-panel { min-height: 420px; }
      .board { grid-template-columns: repeat(2,minmax(0,1fr)); }
    }
    @media (max-width: 980px) {
      .kpi-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
      .grid4 { grid-template-columns: 1fr; }
      .board { grid-template-columns: 1fr; }
      .row2 { grid-template-columns: 1fr; }
      .header { grid-template-columns: 1fr; }
      .meta { justify-content: flex-start; }
    }
  </style>
</head>
<body>
<div class="shell">
  <header class="header">
    <div>
      <h1 class="title">CI/CD 관제센터</h1>
      <div class="subtitle">서비스 모니터링 화면과 동일 톤 · 운영자 관점 실행/승인 흐름</div>
    </div>
    <div class="meta">
      <span id="overall" class="chip">종합 상태 -</span>
      <span class="chip">마지막 갱신: <span id="updated">-</span></span>
    </div>
  </header>

  <section class="kpi-grid">
    <article class="kpi"><div class="kpi-label">최신 CI</div><div id="ci-status" class="kpi-value">-</div></article>
    <article class="kpi"><div class="kpi-label">최신 Build</div><div id="build-status" class="kpi-value">-</div></article>
    <article class="kpi"><div class="kpi-label">최신 Deploy</div><div id="deploy-status" class="kpi-value">-</div></article>
    <article class="kpi"><div class="kpi-label">최근 실패(20)</div><div id="fail-count" class="kpi-value">-</div></article>
  </section>

  <section class="ops-bar">
    <div class="row2">
      <select id="workflow-filter"><option value="">전체</option><option value="CI">CI</option><option value="Build and Push Image">Build&Push</option><option value="Deploy">Deploy</option></select>
      <select id="refresh-interval"><option value="5000">5초</option><option value="10000">10초</option><option value="30000">30초</option></select>
    </div>
    <input id="run-search" placeholder="워크플로/sha 검색">
    <div class="row2">
      <input id="auth-user" placeholder="ID (예: ops)">
      <input id="auth-pass" type="password" placeholder="비밀번호">
    </div>
    <div class="row2">
      <button id="auto-refresh-btn">자동갱신 ON</button>
      <button id="refresh-btn">즉시갱신</button>
    </div>
  </section>
  <div id="global-alert" class="alert bad"></div>

  <section class="main-grid">
    <article class="panel">
      <div class="section-head">
        <h2 class="section-title">실행 관제</h2>
        <div class="view-tabs">
          <button class="view-btn active" data-view="timeline">타임라인</button>
          <button class="view-btn" data-view="pipeline">보드</button>
          <button class="view-btn" data-view="table">테이블</button>
          <button class="view-btn" data-view="audit">감사 로그</button>
        </div>
      </div>
      <div class="scroll-area">
        <div id="run-timeline" class="list"></div>
        <div id="run-pipeline" class="board" style="display:none"></div>
        <div id="run-table" class="table-wrap" style="display:none"></div>
        <div id="audit-list" class="list" style="display:none"></div>
      </div>
    </article>

    <article class="panel">
      <div class="section-head">
        <h2 class="section-title">선택 실행 상세</h2>
      </div>
      <div class="detail-grid">
        <div id="run-detail" class="detail-box">실행 항목을 선택하면 상세가 표시됩니다.</div>
        <div id="stage-list" class="stages"></div>
        <div id="run-log" class="log">-</div>
      </div>
    </article>

    <article class="panel stack-panel">
      <div>
        <h2 class="section-title">배포 요청</h2>
        <div class="deploy-form">
          <select id="deploy-tag"></select>
          <input id="deploy-custom-tag" placeholder="커스텀 태그 (선택)">
          <textarea id="request-note" placeholder="요청 사유"></textarea>
          <button id="request-btn" class="btn-primary">배포 요청 생성</button>
          <div id="request-result" class="subtitle">요청 상태 대기</div>
        </div>
      </div>
      <div class="scroll-area">
        <h3 class="compact-title">승인 대기 목록</h3>
        <div id="request-list" class="list"></div>
      </div>
      <div class="deploy-actions">
        <h3 class="compact-title">승인/반려 처리</h3>
        <div class="row2">
          <input id="approve-request-id" placeholder="요청 ID">
          <input id="approve-key" placeholder="승인키">
        </div>
        <textarea id="approve-note" placeholder="반려 사유 또는 처리 메모"></textarea>
        <div class="row2">
          <button id="approve-btn" class="btn-warn">승인 + 배포실행</button>
          <button id="reject-btn" class="btn-bad">요청 반려</button>
        </div>
        <div id="approve-result" class="subtitle">처리 상태 대기</div>
      </div>
    </article>
  </section>
</div>

<script>
let refreshMs=5000, autoRefresh=true, refreshTimer=null, selectedRunId=null, configured=true, currentView="timeline";
let latestRuns=[];
const STAGES=["Checkout","Setup Java","Run tests","Test","Build Docker image","Smoke test container health","Trivy image scan","Log in to GHCR","Build and push image","Resolve image tag","Login to GHCR","Deploy app container"];
const el=(id)=>document.getElementById(id);
const fmt=(s)=>s?new Date(s).toLocaleString("ko-KR"):"-";
const tone=(s,c)=>{if(["in_progress","queued","waiting"].includes(s))return"run";if(c==="success"||String(c).toLowerCase().includes("requested"))return"ok";if(["failure","timed_out","cancelled"].includes(c)||String(c).toLowerCase().includes("denied")||String(c).toLowerCase().includes("rejected"))return"bad";return"warn";}
const statusText=(s,c)=>s==="completed"?(c||"completed"):(s||"-");
function showAlert(msg,level="bad"){const b=el("global-alert");if(!msg){b.style.display="none";b.textContent="";return;}b.style.display="block";b.className="alert "+level;b.textContent=msg;}
function authHeaders(){const u=el("auth-user").value.trim();const p=el("auth-pass").value;if(!u||!p)return {};return {"Authorization":"Basic "+btoa(u+":"+p)};}
async function getJson(url,opt={}){const r=await fetch(url,opt);if(!r.ok)throw new Error((await r.text())||("HTTP "+r.status));return await r.json();}
function classify(job){if(!job)return"분석 정보 없음";const f=(job.steps||[]).find(s=>s.conclusion==="failure");if(!f)return"문제 없음";const n=String(f.name||"").toLowerCase();if(n.includes("test"))return"테스트 실패";if(n.includes("trivy"))return"보안 스캔 실패";if(n.includes("docker")&&n.includes("build"))return"이미지 빌드 실패";if(n.includes("ghcr")||n.includes("login"))return"레지스트리 인증 실패";if(n.includes("deploy"))return"배포 단계 실패";return"실패 단계: "+f.name;}
function applyCriticalHighlight(lines, failedStep){if(!failedStep||!lines.length)return lines;const key=String(failedStep).toLowerCase();return lines.map(line=>line.toLowerCase().includes(key)?("[CRITICAL] "+line):line);}

function renderTimeline(view){
  const box=el("run-timeline");
  if(!view.length){box.innerHTML='<div class="item">표시할 실행 없음</div>';return;}
  box.innerHTML=view.map(r=>`<div class="item ${String(r.id)===String(selectedRunId)?"active":""}"><div class="grid4"><button class="title-btn run-open" data-run="${r.id}">${r.name}</button><div class="mono">${(r.head_sha||"-").slice(0,12)}</div><div><span class="chip ${tone(r.status,r.conclusion)}">${statusText(r.status,r.conclusion)}</span></div><div>${fmt(r.updated_at)}</div></div></div>`).join("");
  document.querySelectorAll(".run-open").forEach(b=>b.addEventListener("click",()=>{selectedRunId=b.dataset.run;loadRunDetail(b.dataset.run);}));
}

function renderPipelineBoard(view){
  const lanes={queued:[],in_progress:[],success:[],failure:[]};
  view.forEach(r=>{const c=String(r.conclusion||"");const s=String(r.status||"");if(["queued","waiting","requested"].includes(s))lanes.queued.push(r);else if(s==="in_progress")lanes.in_progress.push(r);else if(c==="success")lanes.success.push(r);else lanes.failure.push(r);});
  const box=el("run-pipeline");
  const lane=(title,key)=>`<div class="lane"><h4>${title} (${lanes[key].length})</h4>${lanes[key].slice(0,10).map(r=>`<div class="card-mini"><div><button class="title-btn run-open" data-run="${r.id}">${r.name}</button></div><div class="mono">${(r.head_sha||"-").slice(0,10)}</div><div>${fmt(r.updated_at)}</div></div>`).join("")||"<div class='card-mini'>-</div>"}</div>`;
  box.innerHTML=[lane("대기","queued"),lane("진행중","in_progress"),lane("성공","success"),lane("실패/기타","failure")].join("");
  document.querySelectorAll("#run-pipeline .run-open").forEach(b=>b.addEventListener("click",()=>{selectedRunId=b.dataset.run;loadRunDetail(b.dataset.run);}));
}

function renderTable(view){
  const box=el("run-table");
  if(!view.length){box.innerHTML='<div class="item">표시할 실행 없음</div>';return;}
  box.innerHTML=`<table><thead><tr><th>Workflow</th><th>SHA</th><th>Status</th><th>Updated</th><th>Open</th></tr></thead><tbody>${view.map(r=>`<tr><td>${r.name||"-"}</td><td class="mono">${(r.head_sha||"-").slice(0,12)}</td><td><span class="chip ${tone(r.status,r.conclusion)}">${statusText(r.status,r.conclusion)}</span></td><td>${fmt(r.updated_at)}</td><td><button class="title-btn run-open" data-run="${r.id}">상세</button></td></tr>`).join("")}</tbody></table>`;
  document.querySelectorAll("#run-table .run-open").forEach(b=>b.addEventListener("click",()=>{selectedRunId=b.dataset.run;loadRunDetail(b.dataset.run);}));
}

function switchView(view){
  currentView=view;
  document.querySelectorAll(".view-btn").forEach(b=>b.classList.toggle("active",b.dataset.view===view));
  el("run-timeline").style.display=view==="timeline"?"grid":"none";
  el("run-pipeline").style.display=view==="pipeline"?"grid":"none";
  el("run-table").style.display=view==="table"?"block":"none";
  el("audit-list").style.display=view==="audit"?"grid":"none";
  renderRunViews();
}

function renderRunViews(){
  renderTimeline(latestRuns);
  renderPipelineBoard(latestRuns);
  renderTable(latestRuns);
}

async function loadSummary(){
  const s=await getJson("/api/cicd/summary");configured=!!s.configured;el("updated").textContent=new Date().toLocaleTimeString("ko-KR");
  if(!configured){el("overall").className="chip warn";el("overall").textContent="설정 필요";showAlert(s.message||"GitHub 설정 필요","warn");return;}
  const runs=s.runs||[];const latest=(name)=>runs.find(r=>r.name===name)||null;
  const ci=latest("CI"), build=latest("Build and Push Image"), dep=latest("Deploy");
  el("ci-status").textContent=ci?statusText(ci.status,ci.conclusion):"-";
  el("build-status").textContent=build?statusText(build.status,build.conclusion):"-";
  el("deploy-status").textContent=dep?statusText(dep.status,dep.conclusion):"-";
  const failures=runs.filter(r=>r.conclusion==="failure").length;el("fail-count").textContent=String(failures);
  el("overall").className="chip "+(failures>0?"warn":"ok");el("overall").textContent=failures>0?"종합 상태 WARNING":"종합 상태 NORMAL";
  const tags=s.deployableTags||["latest"];const ds=el("deploy-tag");ds.innerHTML="";tags.forEach(tag=>{const o=document.createElement("option");o.value=tag;o.textContent=tag==="latest"?"latest":tag.slice(0,12);ds.appendChild(o);});
  showAlert(s.message||"", s.message?"warn":"bad");
}

async function loadRuns(){
  const filter=el("workflow-filter").value, kw=el("run-search").value.trim().toLowerCase();
  const runs=await getJson("/api/cicd/runs?limit=20&workflow="+encodeURIComponent(filter));
  latestRuns=kw?runs.filter(r=>String(r.name||"").toLowerCase().includes(kw)||String(r.head_sha||"").toLowerCase().includes(kw)):runs;
  renderRunViews();
}

function renderStages(job){const box=el("stage-list");if(!job){box.innerHTML="";return;}const map=new Map();(job.steps||[]).forEach(s=>map.set(s.name,s));box.innerHTML=STAGES.map(n=>{const s=map.get(n);const st=s?statusText(s.status,s.conclusion):"not-run";const c=s?tone(s.status,s.conclusion):"warn";return`<div class="stage"><span>${n}</span><span class="chip ${c}">${st}</span></div>`;}).join("");}

async function loadRunDetail(runId){
  const jobs=await getJson("/api/cicd/runs/"+runId+"/jobs");
  if(!jobs.length){el("run-detail").textContent="job 데이터 없음";el("run-log").textContent="-";renderStages(null);return;}
  const j=jobs[0], failed=(j.steps||[]).find(s=>s.conclusion==="failure");
  el("run-detail").textContent=["Job: "+(j.name||"-"),"상태: "+statusText(j.status,j.conclusion),"시작: "+fmt(j.started_at),"완료: "+fmt(j.completed_at),"원인: "+classify(j),j.html_url?("링크: "+j.html_url):""].filter(Boolean).join("\n");
  renderStages(j);
  if(j.id&&failed){try{const p=await getJson("/api/cicd/jobs/"+j.id+"/logs-preview?lines=120");const logs=applyCriticalHighlight(p.lines||[], failed.name);el("run-log").textContent=logs.slice(-50).join("\n")||"로그 없음";}catch(e){el("run-log").textContent="로그 조회 실패: "+e.message;}}else{el("run-log").textContent="실패 로그 없음";}
}

async function createRequest(){const tag=el("deploy-custom-tag").value.trim()||el("deploy-tag").value||"latest";const note=el("request-note").value.trim();try{const r=await getJson("/api/cicd/deploy/requests",{method:"POST",headers:{"Content-Type":"application/json",...authHeaders()},body:JSON.stringify({imageTag:tag,note})});el("request-result").textContent=`요청 생성 완료: ${r.status} / ${r.imageTag}`;await refreshAll();}catch(e){el("request-result").textContent="요청 생성 실패: "+e.message;showAlert("요청 생성 실패: "+e.message,"bad");}}
async function loadRequests(){let req=[];try{req=await getJson("/api/cicd/deploy/requests?limit=15",{headers:{...authHeaders()}});}catch(e){el("request-list").innerHTML='<div class="item">요청목록 조회 실패(인증 필요)</div>';return;}const box=el("request-list");if(!req.length){box.innerHTML='<div class="item">요청 없음</div>';return;}box.innerHTML=req.map(r=>`<div class="item"><div class="grid4"><button class="title-btn req-pick" data-id="${r.id}">#${r.id}</button><div class="mono">${r.imageTag}</div><div><span class="chip ${tone(r.status,r.status)}">${r.status}</span></div><div>${fmt(r.requestedAt)}</div></div><div class="subtitle">요청자 ${r.requestedBy} · 승인자 ${r.approvedBy||"-"}</div><div class="subtitle">사유: ${r.note||"-"}</div></div>`).join("");document.querySelectorAll(".req-pick").forEach(b=>b.addEventListener("click",()=>el("approve-request-id").value=b.dataset.id));}
async function approveRequest(){const id=el("approve-request-id").value.trim();if(!id)return;const approvalKey=el("approve-key").value.trim();try{const r=await getJson("/api/cicd/deploy/requests/"+id+"/approve",{method:"POST",headers:{"Content-Type":"application/json",...authHeaders()},body:JSON.stringify({approvalKey})});el("approve-result").textContent=`승인 완료: #${r.requestId} / ${r.requestStatus} / ${r.imageTag}`;await refreshAll();}catch(e){el("approve-result").textContent="승인 실패: "+e.message;showAlert("승인 실패: "+e.message,"bad");}}
async function rejectRequest(){const id=el("approve-request-id").value.trim();if(!id)return;const note=el("approve-note").value.trim();try{const r=await getJson("/api/cicd/deploy/requests/"+id+"/reject",{method:"POST",headers:{"Content-Type":"application/json",...authHeaders()},body:JSON.stringify({note})});el("approve-result").textContent=`반려 완료: #${r.requestId} / ${r.status}`;await refreshAll();}catch(e){el("approve-result").textContent="반려 실패: "+e.message;showAlert("반려 실패: "+e.message,"bad");}}
async function loadAudit(){const box=el("audit-list");let logs=[];try{logs=await getJson("/api/cicd/audit?limit=20",{headers:{...authHeaders()}});}catch(e){box.innerHTML='<div class="item">감사로그 조회 실패(인증 필요)</div>';return;}if(!logs.length){box.innerHTML='<div class="item">감사로그 없음</div>';return;}box.innerHTML=logs.map(a=>`<div class="item"><div>${fmt(a.requestedAt)} · ${a.action||"-"} · ${a.operator||"-"} · <span class="chip ${tone(a.status,a.status)}">${a.status||"-"}</span></div><div class="subtitle mono">${a.imageTag||"-"} / ${a.message||""}</div></div>`).join("");}

function setTimer(){if(refreshTimer)clearInterval(refreshTimer);refreshTimer=null;if(autoRefresh)refreshTimer=setInterval(refreshAll,refreshMs);} 
function toggleAuto(){autoRefresh=!autoRefresh;el("auto-refresh-btn").textContent="자동갱신 "+(autoRefresh?"ON":"OFF");setTimer();}
async function refreshAll(){try{await loadSummary();await loadRuns();await loadRequests();await loadAudit();}catch(e){showAlert("조회 실패: "+e.message,"bad");el("overall").className="chip bad";el("overall").textContent="종합 상태 CRITICAL";}}

document.querySelectorAll(".view-btn").forEach(b=>b.addEventListener("click",()=>switchView(b.dataset.view)));
el("refresh-btn").addEventListener("click",refreshAll);
el("workflow-filter").addEventListener("change",loadRuns);
el("run-search").addEventListener("input",loadRuns);
el("refresh-interval").addEventListener("change",(e)=>{refreshMs=Number(e.target.value)||5000;setTimer();});
el("auto-refresh-btn").addEventListener("click",toggleAuto);
el("request-btn").addEventListener("click",createRequest);
el("approve-btn").addEventListener("click",approveRequest);
el("reject-btn").addEventListener("click",rejectRequest);
refreshAll();setTimer();
</script>
</body>
</html>
