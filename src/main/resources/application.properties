spring.application.name=study-cicd-monitoring

server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://127.0.0.1:3306/}
spring.datasource.username=root
spring.datasource.password=skic
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true
management.prometheus.metrics.export.enabled=true
management.graphite.metrics.export.enabled=${GRAPHITE_ENABLED:false}
management.metrics.tags.application=${spring.application.name}

management.tracing.enabled=true
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4318/v1/traces}
