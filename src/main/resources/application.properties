spring.config.import=optional:file:.env[.properties]

spring.application.name=study-cicd-monitoring

server.port=${SERVER_PORT:18080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://127.0.0.1:3306/study}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true
management.prometheus.metrics.export.enabled=true
management.graphite.metrics.export.enabled=${GRAPHITE_ENABLED:false}
management.metrics.tags.application=${spring.application.name}

management.tracing.enabled=true
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4318/v1/traces}

# GitHub Actions integration for CI/CD dashboard
cicd.github.api-base=${CICD_GITHUB_API_BASE:https://api.github.com}
cicd.github.owner=${CICD_GITHUB_OWNER:}
cicd.github.repo=${CICD_GITHUB_REPO:}
cicd.github.token=${CICD_GITHUB_TOKEN:}
cicd.github.deploy-workflow=${CICD_GITHUB_DEPLOY_WORKFLOW:deploy.yml}
cicd.github.deploy-ref=${CICD_GITHUB_DEPLOY_REF:main}
cicd.deploy.approval-key=${CICD_DEPLOY_APPROVAL_KEY:}
cicd.deploy.admin-users=${CICD_DEPLOY_ADMIN_USERS:ops}
cicd.security.username=${CICD_SECURITY_USERNAME:ops}
cicd.security.password=${CICD_SECURITY_PASSWORD:}
cicd.security.role=${CICD_SECURITY_ROLE:OPS}
